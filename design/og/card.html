<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
/* 공유 카드의 삽화는 실제 사건 사진과 구분한다 */
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; background: #fff; color: #141414; }
.top { height: 210px; padding: 38px 56px 28px; display: flex; align-items: center; justify-content: space-between; gap: 36px; }
h1 { font-size: 70px; font-weight: 900; letter-spacing: -.04em; line-height: 1.3; }
.tagline { margin-top: 10px; color: #474c54; font-size: 27px; font-weight: 500; }
.label { border-left: 4px solid #0047a0; padding-left: 22px; font-size: 24px; line-height: 1.6; color: #0047a0; font-weight: 700; }
.illustration { height: 350px; width: 1200px; object-fit: cover; object-position: center bottom; image-rendering: pixelated; display: block; border-block: 1px solid #ced2d8; }
.foot { height: 70px; padding: 16px 56px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 500; color: #62676f; border-bottom: 8px solid #0047a0; }
.foot b { color: #0047a0; }
</style>
</head>
<body>
  <div class="top"><div><h1>대한민국 조간</h1><p class="tagline">출처와 기준으로 읽는 오늘의 대한민국</p></div><p class="label">전국 뉴스<br>끝까지 이슈 추적</p></div>
  <img class="illustration" src="../../dev/web/assets/images/news-dawn-pixel.webp" alt="픽셀로 그린 아침 풍경">
  <div class="foot"><span>매일 아침 · AI 생성 삽화</span><b>korea-jogan.com</b></div>
</body>
</html>
