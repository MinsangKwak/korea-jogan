<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap">
<style>
/* 앱 아이콘 512×512. build.mjs가 192·180 크기로 줄여 찍는다 */
/* 글자는 가운데 80% 안에 두어 마스크(원·둥근 사각)로 잘려도 보이게 한다 */
* { box-sizing: border-box; margin: 0; }
html, body { width: 512px; height: 512px; }
body { position: relative; background: #111111; color: #ffffff; font-family: "Noto Sans KR", sans-serif; display: grid; place-items: center; }
b { font-size: 300px; font-weight: 900; line-height: 1; transform: translateY(-14px); }
i { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #0047a0; }
</style>
</head>
<body><b>조</b><i></i></body>
</html>
