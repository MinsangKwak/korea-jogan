# 안정 main에서 초안 누락과 최근 미공개 호를 복구한다
name: 아침 발행

on:
  workflow_dispatch:
  workflow_run:
    workflows: [검사]
    types: [completed]
  schedule:
    # 한국 시간 06:00 자동 발행과 기존 06:07·06:37·07:17·08:17 재확인
    - cron: "0 21 * * *"
    - cron: "7 21 * * *"
    - cron: "37 21 * * *"
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && startsWith(github.event.workflow_run.head_branch, 'daily/') && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/tests/browser/package-lock.json
      - name: 브라우저 검사 도구 설치
        working-directory: dev/tests/browser
        run: npm ci
      - name: 준비된 Chromium 사용 또는 제한된 재시도 설치
        working-directory: dev/tests/browser
        run: python3 ../../tools/install_browser.py
      - name: 초안 복구·같은 SHA 검사·최근 누락 호 선별 발행
        run: python3 dev/pipeline/publish/publish_pending.py
