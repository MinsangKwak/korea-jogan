# 안정 main에서 초안 누락과 최근 미공개 호를 복구한다
name: 아침 발행

on:
  workflow_dispatch:
  workflow_run:
    workflows: [검사]
    types: [completed]
  schedule:
    # 한국 시간 06:00 자동 발행과 기존 06:07·06:37·07:17·08:17 재확인
    - cron: "0 21 * * *"
    - cron: "7 21 * * *"
    - cron: "37 21 * * *"
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write
  actions: write
  checks: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && startsWith(github.event.workflow_run.head_branch, 'daily/') && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: start
        name: 발행 전 main 커밋 기록
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/tests/browser/package-lock.json
      - name: 브라우저 검사 도구 설치
        working-directory: dev/tests/browser
        run: npm ci
      - name: 준비된 Chromium 사용 또는 제한된 재시도 설치
        working-directory: dev/tests/browser
        run: python3 ../../tools/install_browser.py
      - name: 초안 복구·같은 SHA 검사·최근 누락 호 선별 발행
        run: python3 dev/pipeline/publish/publish_pending.py
      # 사람이 하던 공개 build-info.json 대조를 자동화한다. 06시 전에는 건너뛰고 불일치면 실행을 실패시킨다
      - name: 공개 build-info의 오늘 호·main·deploy SHA 일치 확인
        run: python3 dev/pipeline/publish/verify_publication.py --expect-today --timeout 900
      # 알림은 발행 결과를 바꾸지 않는다. 설정이 없거나 실패해도 발행은 성공으로 남는다
      - name: 새로 공개한 최신 호를 텔레그램 채널에 알리기
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE_SHA: ${{ steps.start.outputs.sha }}
        run: |
          git fetch origin main
          python3 dev/pipeline/publish/notify_telegram.py --before "$BEFORE_SHA" --after origin/main
