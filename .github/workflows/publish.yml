# 매일 06:00(한국 시간) dev의 오늘 호를 main·deploy로 빨리 감기하고 배포를 띄운다
# 사람이 승인하지 않은 초안은 검사를 통과하면 '자동 발행'으로 공개한다(화면에 편집자 확인 전으로 표시)
# 오늘 호가 없거나 검사에 실패하면 아무것도 올리지 않고 지난 호를 그대로 둔다
name: 아침 발행

on:
  workflow_dispatch:
  schedule:
    # GitHub 예약 실행은 정각에 몰려 몇 시간씩 밀리기도 한다(10/23은 06:00 예약이 08:47에 실행).
    # 정각을 피한 06:07에 돌리고, 밀리거나 빠질 때를 대비해 06:37·07:17·08:17에 다시 본다(한국 시간).
    # 이미 올라간 호는 건너뛰므로 여러 번 돌아도 한 번만 발행된다
    - cron: "7 21 * * *"
    - cron: "37 21 * * *"
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 오늘(KST) 호가 목록의 최신 호이고 초안 또는 승인 상태인지 본다
      - id: gate
        name: 오늘 호 승인 여부
        run: |
          DATE="$(TZ=Asia/Seoul date +%F)"
          python3 - "$DATE" <<'PY'
          import json, os, sys
          from pathlib import Path
          date = sys.argv[1]
          issues = Path("dev/web/data/issues")
          path = issues / f"{date}.json"
          latest = json.loads((issues / "index.json").read_text(encoding="utf-8")).get("latest")
          status = json.loads(path.read_text(encoding="utf-8")).get("status") if path.exists() else None
          run = status in ("draft", "published") and latest == date
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={str(run).lower()}\n")
              out.write(f"date={date}\nstatus={status}\n")
          if not run:
              print(f"::notice::{date}호를 올리지 않습니다(상태: {status or '없음'}, 최신 호: {latest})")
          PY
      # 06시까지 사람이 승인하지 않았으면 검사를 통과한 초안을 자동 발행으로 바꿔 dev에 올린다
      - name: 자동 발행
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.status == 'draft'
        run: |
          python dev/pipeline/publish/validate.py
          python dev/pipeline/publish/approve.py "${{ steps.gate.outputs.date }}" --auto
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data(issue): ${{ steps.gate.outputs.date }}호 자동 발행"
          git push origin HEAD:dev
      - name: 배포 규칙 검사
        if: steps.gate.outputs.run == 'true'
        run: python dev/pipeline/publish/validate.py --deploy
      # main이 dev의 조상이 아니면(누가 main에 따로 올린 경우) 덮어쓰지 않고 멈춘다
      - id: push
        name: main·deploy 빨리 감기
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin main deploy
          if [ "$(git rev-parse origin/deploy)" = "$(git rev-parse HEAD)" ]; then
            echo "deploy가 이미 dev와 같은 커밋입니다."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for b in main deploy; do
            if ! git merge-base --is-ancestor "origin/$b" HEAD; then
              echo "::error::$b가 dev의 조상이 아니라 빨리 감기할 수 없습니다. 브랜치를 손으로 맞춘 뒤 다시 실행합니다"
              exit 1
            fi
          done
          git push origin HEAD:main HEAD:deploy
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN으로 올린 push는 다른 워크플로를 띄우지 않으므로 배포는 직접 실행한다
      - name: 사이트 배포 실행
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref deploy
