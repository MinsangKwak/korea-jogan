name: 개발 코드 승격

on:
  workflow_dispatch:
    inputs:
      dev_sha:
        description: 관리자 미리보기 확인을 마친 dev의 40자리 커밋 SHA
        required: true
        type: string
      admin_preview_verified:
        description: 현재 커밋의 개발 URL에서 익명 접근 차단과 관리자 본문 열람을 확인했습니다
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_SHA: ${{ inputs.dev_sha }}
      ADMIN_PREVIEW_VERIFIED: ${{ inputs.admin_preview_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: refs
        name: 요청한 dev 커밋과 운영 이력 확인
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::소문자 40자리 dev SHA를 입력해야 합니다"
            exit 1
          fi
          if [ "$ADMIN_PREVIEW_VERIFIED" != "true" ]; then
            echo "::error::현재 dev 커밋의 익명 차단과 관리자 열람을 확인한 뒤 확인 항목을 선택해야 합니다"
            exit 1
          fi
          git fetch origin dev:refs/remotes/origin/dev main:refs/remotes/origin/main deploy:refs/remotes/origin/deploy
          DEV_SHA="$(git rev-parse origin/dev)"
          MAIN_SHA="$(git rev-parse origin/main)"
          DEPLOY_SHA="$(git rev-parse origin/deploy)"
          if [ "$CANDIDATE_SHA" != "$DEV_SHA" ]; then
            echo "::error::dev가 입력한 커밋에서 바뀌었습니다. 새 커밋을 검증한 뒤 다시 실행합니다"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$MAIN_SHA" ]; then
            echo "::error::검사 도중 main이 바뀌었습니다. 최신 main에서 다시 실행합니다"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$MAIN_SHA" "$CANDIDATE_SHA" || ! git merge-base --is-ancestor "$DEPLOY_SHA" "$CANDIDATE_SHA"; then
            echo "::error::운영 이력이 dev에 포함되어 있지 않습니다. main을 dev에 병합하고 다시 검증합니다"
            exit 1
          fi
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: 같은 커밋의 CI와 보호된 개발 배포 확인
        shell: bash
        env:
          CURRENT_DEV_SHA: ${{ steps.refs.outputs.dev_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/commits/$CANDIDATE_SHA/check-runs?filter=latest&per_page=100" > "$RUNNER_TEMP/release-checks.json"
          gh api --paginate --slurp "repos/$GH_REPO/commits/$CANDIDATE_SHA/statuses?per_page=100" > "$RUNNER_TEMP/release-status-pages.json"
          python3 - "$RUNNER_TEMP/release-status-pages.json" "$RUNNER_TEMP/release-statuses.json" <<'PY'
          import json, sys
          from pathlib import Path
          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(pages, list) or not all(isinstance(page, list) for page in pages):
              raise SystemExit("원본 status 페이지 응답 형식이 잘못됐습니다")
          Path(sys.argv[2]).write_text(json.dumps([item for page in pages for item in page]), encoding="utf-8")
          PY
          python3 dev/pipeline/publish/check_release.py --sha "$CANDIDATE_SHA" --dev-sha "$CURRENT_DEV_SHA" --checks "$RUNNER_TEMP/release-checks.json" --statuses "$RUNNER_TEMP/release-statuses.json"
      - name: 승인한 커밋만 main과 deploy에 반영
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
          EXPECTED_DEPLOY_SHA: ${{ steps.refs.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          git fetch origin dev:refs/remotes/origin/dev main:refs/remotes/origin/main deploy:refs/remotes/origin/deploy
          if [ "$(git rev-parse origin/dev)" != "$CANDIDATE_SHA" ] || [ "$(git rev-parse origin/main)" != "$EXPECTED_MAIN_SHA" ] || [ "$(git rev-parse origin/deploy)" != "$EXPECTED_DEPLOY_SHA" ]; then
            echo "::error::검사 후 브랜치가 바뀌어 승격을 중단합니다. 현재 커밋으로 다시 검증합니다"
            exit 1
          fi
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/deploy "$CANDIDATE_SHA"
          git push --atomic origin "$CANDIDATE_SHA:refs/heads/main" "$CANDIDATE_SHA:refs/heads/deploy"
      - name: 승인한 커밋의 배포와 운영 결과 확인
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/workflows/deploy-pages.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/release-previous-runs.json"
          STARTED_AFTER="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RELEASE_DEADLINE="$(( $(date +%s) + 600 ))"
          gh workflow run deploy-pages.yml --ref deploy -f source_sha="$CANDIDATE_SHA"
          DEPLOY_READY=false
          while [ "$(date +%s)" -lt "$RELEASE_DEADLINE" ]; do
            gh api "repos/$GH_REPO/actions/workflows/deploy-pages.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/release-runs.json"
            set +e
            python3 dev/pipeline/publish/check_release.py --sha "$CANDIDATE_SHA" --deployment-runs "$RUNNER_TEMP/release-runs.json" --previous-runs "$RUNNER_TEMP/release-previous-runs.json" --started-after "$STARTED_AFTER"
            STATE=$?
            set -e
            if [ "$STATE" -eq 0 ]; then
              DEPLOY_READY=true
              break
            fi
            if [ "$STATE" -ne 2 ]; then
              echo "::error::요청한 운영 배포가 실패했습니다"
              exit 1
            fi
            sleep 15
          done
          if [ "$DEPLOY_READY" != true ]; then
            echo "::error::운영 배포가 10분 안에 성공하지 않았습니다"
            exit 1
          fi
          export RELEASE_DEADLINE
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          sys.path.insert(0, "dev/pipeline/publish")
          from check_release import manifest_matches
          sha = os.environ["CANDIDATE_SHA"]
          deadline = int(os.environ["RELEASE_DEADLINE"])
          while time.time() < deadline:
              try:
                  request = urllib.request.Request("https://korea-jogan.com/build-info.json?release_sha=" + sha, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      manifest = json.load(response)
                  if manifest_matches(sha, manifest):
                      print("운영 배포 확인 완료: " + sha)
                      break
              except (OSError, ValueError) as error:
                  print("운영 manifest 확인 대기: " + type(error).__name__)
              time.sleep(15)
          else:
              raise SystemExit("운영 build-info.json이 승인한 SHA로 바뀌지 않았습니다")
          PY
