name: 개발 코드 승격

on:
  workflow_dispatch:
  workflow_run:
    workflows: [통합 검사와 자동 승격]
    types: [completed]
    branches: [dev, main]

permissions:
  contents: write
  actions: write
  checks: read
  statuses: read

concurrency:
  group: release-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 이미 통과한 같은 SHA의 검사 증거로 누락 승격·배포만 복구
        run: python3 dev/pipeline/publish/auto_release.py --wait-seconds 300
