# 이미 공개한 호를 날짜로 골라 이메일 구독자에게 한 번 더 보낸다. 사람이 수동으로만 실행한다
# 평소 발송은 아침 발행(publish.yml)이 새로 공개한 호만 자동으로 맡는다
name: 이메일 수동 발송

on:
  workflow_dispatch:
    inputs:
      date:
        description: 보낼 호 날짜(YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 그 날짜 호를 이메일로 보내기
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          ISSUE_DATE: ${{ inputs.date }}
        run: |
          out=$(python3 backend-python/pipeline/publish/notify_email.py --date "$ISSUE_DATE" --after HEAD)
          echo "$out"
          # 실패 안내에도 '이메일 발송'이 들어가므로 마지막 줄이 정확히 성공 결과일 때만 통과한다
          test "$(printf '%s\n' "$out" | tail -n 1)" = "${ISSUE_DATE}호 이메일 발송"
