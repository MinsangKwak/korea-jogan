# deploy 브랜치에 올라온 것만 GitHub Pages로 배포한다. 개발(dev)·최종본(main)은 여기서 배포하지 않는다
name: 사이트 배포

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 검사에 실패하면 배포하지 않는다
      - name: 데이터 검사
        run: python scripts/validate.py --deploy
      # RSS는 저장소에 두지 않고 배포할 때마다 발행 목록으로 새로 만든다
      - name: RSS 만들기
        run: python scripts/build_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
