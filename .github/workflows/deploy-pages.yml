# deploy 브랜치에 올라온 것만 GitHub Pages로 배포한다. 개발(dev)·최종본(main)은 여기서 배포하지 않는다
# 평일 낮에는 1시간마다 같은 deploy 커밋을 다시 배포하면서 ECOS 최신 숫자(live.json)만 새로 만든다. 커밋은 하지 않는다
name: 사이트 배포

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 배포할 deploy 커밋의 고정 SHA
        required: false
        type: string
      retry_attempt:
        description: 자동 재시도 횟수
        required: false
        default: '0'
        type: string
  schedule:
    # 한국 시간 평일 09:17~22:17 매시(UTC 00~13시)
    - cron: "17 0-13 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
    steps:
      - name: 고정 배포 입력 확인
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          source = os.environ.get("REQUESTED_SOURCE_SHA", "")
          if source and not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source_sha에는 40자리 소문자 커밋 SHA가 필요합니다")
          PY
      # push는 이벤트 커밋, 수동 실행은 지정한 SHA, 예약은 deploy 최신 소스를 받는다
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.source_sha || 'deploy' }}
          fetch-depth: 0
      - id: source
        name: 실제 배포 소스와 deploy 일치 확인
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'push' && github.sha || inputs.source_sha || '' }}
        run: |
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin refs/heads/deploy:refs/remotes/origin/deploy
          if [ -n "$EXPECTED_SOURCE_SHA" ] && [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::요청한 커밋과 실제 체크아웃한 커밋이 다릅니다"
            exit 1
          fi
          if [ "$ACTUAL_SOURCE_SHA" != "$(git rev-parse origin/deploy)" ]; then
            echo "::error::deploy가 변경되어 오래된 소스로 덮어쓰지 않습니다"
            exit 1
          fi
          printf 'sha=%s\n' "$ACTUAL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
      # 키가 없으면 예약 실행은 다시 배포할 이유가 없어 여기서 멈춘다
      - id: gate
        name: 예약 실행 조건
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$ECOS_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ECOS_API_KEY가 없어 예약 배포를 건너뜁니다."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 검사에 실패하면 배포하지 않는다
      - name: 데이터 검사
        if: steps.gate.outputs.run == 'true'
        run: python dev/pipeline/publish/validate.py --deploy
      # RSS·사이트맵은 저장소에 두지 않고 배포할 때마다 발행 목록으로 새로 만든다
      - name: RSS·사이트맵 만들기
        if: steps.gate.outputs.run == 'true'
        run: python dev/pipeline/build/build_feed.py
      # JavaScript를 실행하지 않는 검색 로봇도 읽게 첫 화면 요약과 호별 페이지(/YYYY-MM-DD)를 만든다
      - name: 호별 검색 페이지 만들기
        if: steps.gate.outputs.run == 'true'
        run: python dev/pipeline/build/build_pages.py
      # 최신 숫자를 받지 못해도 조간 배포는 막지 않는다. 화면은 파일이 없으면 띠를 숨긴다
      - name: 최신 공식 숫자 만들기
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python dev/pipeline/build/build_live.py
      - name: 실제 배포 소스 기록
        if: steps.gate.outputs.run == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: python3 dev/pipeline/build/build_info.py --source-sha "$SOURCE_SHA"
      - if: steps.gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dev/web
      - id: deployment
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4
      - name: 실제 공개 날짜·호 JSON·홈·빌드 SHA와 시각 확인
        if: steps.gate.outputs.run == 'true'
        run: python3 dev/pipeline/publish/verify_publication.py
      # 새 호가 올라갔을 때만 검색엔진에 알린다. 매시 숫자 갱신 배포에서는 보내지 않는다
      - name: 검색엔진에 새 주소 알리기(IndexNow)
        if: steps.gate.outputs.run == 'true' && github.event_name != 'schedule'
        continue-on-error: true
        run: python dev/pipeline/publish/indexnow.py

  retry:
    needs: deploy
    if: >-
      always() && needs.deploy.result == 'failure' && needs.deploy.outputs.source_sha != '' &&
      (inputs.retry_attempt == '' || inputs.retry_attempt == '0' || inputs.retry_attempt == '1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
      PREVIOUS_ATTEMPT: ${{ inputs.retry_attempt || '0' }}
    steps:
      - name: 같은 소스의 배포·검사를 최대 두 번 자동 재시도
        run: |
          CURRENT_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/deploy" --jq '.object.sha')"
          if [ "$CURRENT_SHA" != "$SOURCE_SHA" ]; then
            echo "새 배포 소스가 있어 이전 소스의 재시도를 중단합니다"
            exit 0
          fi
          NEXT_ATTEMPT="$(( PREVIOUS_ATTEMPT + 1 ))"
          gh workflow run deploy-pages.yml --ref deploy -f source_sha="$SOURCE_SHA" -f retry_attempt="$NEXT_ATTEMPT"
