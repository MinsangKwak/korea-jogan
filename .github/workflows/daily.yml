name: 일일 수집

# 수집기가 다 갖춰지면 schedule 주석을 풀어 매일 04:30 KST(19:30 UTC)에 돌린다
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 19 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한국은행 ECOS 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_ecos.py
      - name: 데이터 검사
        run: python scripts/validate.py
      # 지금은 원본만 아티팩트로 남기고, 발행 JSON 생성과 커밋은 다음 단계에서 붙인다
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
