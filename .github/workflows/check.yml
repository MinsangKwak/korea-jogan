name: 검사

on:
  push:
    branches: ['daily/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 검사할 고정 커밋 SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/verify
      - name: 실제 Google 태그의 페이지뷰 요청을 브라우저 안에서 검증
        run: |
          python3 backend-python/pipeline/build/build_pages.py
          node project/tests/browser/law-analytics-smoke.cjs
