name: 검사

on:
  push:
    branches: ['daily/**']
  pull_request:
    branches: [dev, main, deploy]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 검사할 고정 커밋 SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/verify
